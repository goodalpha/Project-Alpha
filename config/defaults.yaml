# ─────────────────────────────────────────────────────────────────────────────
# Project-Alpha  ·  default configuration
# ─────────────────────────────────────────────────────────────────────────────

# ── Universe ──────────────────────────────────────────────────────────────────
universe:
  source: "sp500"          # sp500 | nasdaq100 | russell1000 | custom_adv
  min_avg_dollar_volume: 5_000_000   # USD / day, 63-day rolling
  min_price: 5.0                     # exclude penny stocks
  max_stocks: 750
  rebalance_universe: "monthly"      # how often to rebuild membership

# ── Forecast horizons ─────────────────────────────────────────────────────────
horizons:
  primary: 5       # trading days  ← main signal
  secondary: 20    # trading days  ← trend confirmation
  experimental: [1, 60]

# ── Data sources ──────────────────────────────────────────────────────────────
data:
  price_source: "yfinance"
  fundamental_source: "sec_edgar"
  macro_source: "fred"
  cache_dir: "data/raw"
  processed_dir: "data/processed"
  features_dir: "data/features"
  start_date: "2005-01-01"
  fred_api_key: ""          # optional — public endpoint used if blank

# ── Feature engineering ───────────────────────────────────────────────────────
features:
  price:
    momentum_windows: [5, 10, 21, 63, 126, 252]
    reversal_windows: [1, 5]
    vol_windows: [21, 63]
    beta_window: 252
  cross_sectional:
    zscore_clip: 3.0
    sector_neutralize: true
  fundamental:
    reporting_lag_days: 45   # assume 45-day delay after fiscal quarter end
    staleness_threshold_days: 400
  macro:
    fred_series:
      - {id: "DFF",    name: "fed_funds_rate"}
      - {id: "T10Y2Y", name: "yield_curve_10y2y"}
      - {id: "VIXCLS", name: "vix"}
      - {id: "CPIAUCSL", name: "cpi_yoy"}
      - {id: "UNRATE",  name: "unemployment"}
      - {id: "DCOILWTICO", name: "oil_price"}
      - {id: "BAMLH0A0HYM2", name: "hy_spread"}
      - {id: "T10YIE",  name: "breakeven_inflation_10y"}

# ── Target engineering ────────────────────────────────────────────────────────
targets:
  primary: "fwd_ret_5d_xs"   # 5-day forward excess return vs SPY
  regression_target: "fwd_ret_5d_xs"
  classification_target: "fwd_ret_5d_positive"
  ranking_target: "fwd_ret_5d_rank"
  vol_adjust: true           # divide by rolling 21d realized vol

# ── Validation ────────────────────────────────────────────────────────────────
validation:
  method: "walk_forward"
  train_years: 5
  val_months: 6
  test_months: 6
  embargo_days: 10           # gap between train and val/test to prevent leakage
  min_train_samples: 50_000

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  baseline: "elastic_net"
  primary: "xgboost"
  ensemble: true
  n_jobs: -1
  random_state: 42
  elastic_net:
    l1_ratio: [0.1, 0.5, 0.9]
    alpha: [0.001, 0.01, 0.1]
    max_iter: 2000
  xgboost:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.02
    subsample: 0.8
    colsample_bytree: 0.7
    min_child_weight: 50
    early_stopping_rounds: 50

# ── Portfolio construction ────────────────────────────────────────────────────
portfolio:
  style: "long_only"         # long_only | long_short
  top_pct: 0.20              # long top 20% by signal
  bottom_pct: 0.20           # short bottom 20% (if long_short)
  weighting: "vol_parity"    # equal | vol_parity | conviction
  target_annual_vol: 0.15    # 15% annualised portfolio vol
  max_position_pct: 0.05     # 5% per stock
  max_sector_pct: 0.30       # 30% per GICS sector
  max_beta: 1.2
  rebalance_freq: "weekly"   # daily | weekly | monthly

# ── Transaction costs ─────────────────────────────────────────────────────────
costs:
  commission_per_share: 0.005        # $0.005 / share (IB style)
  slippage_bps: 5                    # 5 bps one-way
  spread_bps: 3                      # half-spread assumption
  borrow_cost_bps_annual: 50        # for short book
  market_impact_model: "sqrt"        # sqrt | linear | none
  impact_coefficient: 0.1

# ── Risk controls ─────────────────────────────────────────────────────────────
risk:
  max_drawdown_halt: 0.15    # halt trading at 15% drawdown from HWM
  drawdown_reduction: 0.50   # reduce exposure 50% at 10% drawdown
  earnings_blackout_days: 2  # no new positions 2 days before earnings
  max_gross_leverage: 1.0    # long-only: 1.0; long-short: 1.5
  vol_target_lookback: 21    # days for realised vol estimate
  regime_de_risk_pct: 0.50   # reduce exposure 50% in stress regime

# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow:
  tracking_uri: "mlruns"
  experiment_name: "project-alpha"
